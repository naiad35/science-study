<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험 대비 공부방</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(160deg,#4f7cff,#6a5cff);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }
  .logo { font-size:52px; margin-bottom:8px; }
  h1 { font-size:24px; margin:0 0 6px; text-align:center; }
  .sub { font-size:15px; opacity:.9; margin-bottom:32px; text-align:center; }
  .card {
    display:flex; align-items:center; gap:16px;
    width:100%; max-width:340px; text-decoration:none;
    background:#fff; border-radius:18px; padding:22px 24px; margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.18); color:#1f2430;
  }
  .card:active { transform:scale(.98); }
  .ico { font-size:34px; }
  .txt b { display:block; font-size:19px; margin-bottom:2px; }
  .txt span { font-size:14px; color:#5a6273; }
  .foot { margin-top:20px; font-size:13px; opacity:.85; text-align:center; }
</style>
</head>
<body>
  <div class="logo">📚</div>
  <h1>시험 대비 공부방</h1>
  <div class="sub">과목을 선택하세요</div>

  <a class="card" href="science/">
    <span class="ico">🔬</span>
    <span class="txt"><b>과학</b><span>중1 2학기 · 상태 변화 / 여러 가지 힘</span></span>
  </a>

  <a class="card" href="korean/">
    <span class="ico">📖</span>
    <span class="txt"><b>국어</b><span>중1 · 1~2단원 (14~97쪽)</span></span>
  </a>

  <div class="foot">폰 홈 화면에 추가하면 앱처럼 쓸 수 있어요 💪</div>
</body>
</html>
