<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중1 과학 2학기 예상문제</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#fff; --ink:#1f2430; --sub:#5a6273;
    --accent:#4f7cff; --ok:#21b573; --no:#e03131;
    --line:#e4e8f0; --okbg:#e7f8ef; --nobg:#fdecec; --exbg:#eef2ff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.75; font-size:18px; padding:0 0 80px;
  }
  header {
    background:linear-gradient(135deg,#4f7cff,#6a5cff); color:#fff;
    padding:26px 20px 22px; text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
  }
  header h1 { margin:0 0 6px; font-size:21px; }
  header p { margin:0; font-size:14px; opacity:.92; }
  .wrap { padding:16px; max-width:720px; margin:0 auto; }
  .scorebar {
    position:sticky; top:0; z-index:20;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:16px; text-align:center;
    font-weight:700; box-shadow:0 2px 10px rgba(30,40,80,.06);
  }
  .scorebar span { color:var(--accent); }
  .q {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(30,40,80,.06);
  }
  .qhead { display:flex; gap:8px; align-items:flex-start; margin-bottom:12px; }
  .qnum {
    background:var(--accent); color:#fff; font-size:14px; font-weight:700;
    border-radius:8px; padding:3px 9px; flex-shrink:0; margin-top:2px;
  }
  .qtype {
    font-size:12px; color:var(--sub); border:1px solid var(--line);
    border-radius:6px; padding:2px 7px; flex-shrink:0; margin-top:2px;
  }
  .qtext { font-weight:600; }
  .opts { margin:6px 0; }
  .opt {
    display:block; width:100%; text-align:left;
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:8px 0; font-size:16px; cursor:pointer;
    transition:.15s; color:var(--ink);
  }
  .opt:active { transform:scale(.99); }
  .opt.sel { border-color:var(--accent); background:#f0f4ff; }
  .opt.correct { border-color:var(--ok); background:var(--okbg); }
  .opt.wrong { border-color:var(--no); background:var(--nobg); }
  .opt.disabled { pointer-events:none; opacity:.95; }
  input[type=text] {
    width:100%; padding:12px 14px; font-size:16px;
    border:1.5px solid var(--line); border-radius:12px; margin:6px 0;
    font-family:inherit;
  }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  .checkbtn {
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:11px 20px; font-size:15px; font-weight:700; cursor:pointer;
    margin-top:6px;
  }
  .checkbtn:disabled { opacity:.5; }
  .result { font-weight:700; margin:12px 0 6px; font-size:16px; display:none; }
  .result.ox-ok { color:var(--ok); }
  .result.ox-no { color:var(--no); }
  .explain {
    display:none; background:var(--exbg); border-radius:12px;
    padding:13px 15px; margin-top:10px; font-size:15px; line-height:1.65;
  }
  .explain b { color:var(--accent); }
  .ansline { font-weight:700; color:var(--ink); margin-bottom:4px; }
  .oxrow { display:flex; gap:10px; margin:6px 0; }
  .oxbtn {
    flex:1; padding:14px; font-size:17px; font-weight:700; cursor:pointer;
    border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
  }
  .oxbtn.sel { border-color:var(--accent); background:#f0f4ff; }
  .oxbtn.correct { border-color:var(--ok); background:var(--okbg); }
  .oxbtn.wrong { border-color:var(--no); background:var(--nobg); }
  .oxbtn.disabled { pointer-events:none; }
  .note { text-align:center; color:var(--sub); font-size:13px; margin:24px 16px 0; line-height:1.6; }
  .resetbtn {
    display:block; margin:18px auto 0; background:#fff; border:1px solid var(--line);
    color:var(--accent); font-weight:700; font-size:14px; padding:10px 22px;
    border-radius:30px; cursor:pointer;
  }
</style>
</head>

<header>

const quizEl = document.getElementById('quiz');
const doneEl = document.getElementById('done');
const scoreEl = document.getElementById('score');
document.getElementById('total').textContent = quiz.length;
let done = 0, score = 0;
const state = new Array(quiz.length).fill(false); // answered?

function markDone(correct){
  done++; if(correct) score++;
  doneEl.textContent = done; scoreEl.textContent = score;
}

quiz.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'q';
  let html = `<div class="qhead"><span class="qnum">${i+1}</span><span class="qtype">${item.type} · ${item.unit}</span></div>
    <div class="qtext">${item.q}</div>`;

  if(item.type === "객관식"){
    html += `<div class="opts">` + item.opts.map((o,j)=>
      `<button class="opt" data-i="${i}" data-j="${j}">${String.fromCharCode(9312+j)} ${o}</button>`
    ).join('') + `</div>`;
  } else if(item.type === "OX"){
    html += `<div class="oxrow">
      <button class="oxbtn" data-i="${i}" data-v="O">O (맞다)</button>
      <button class="oxbtn" data-i="${i}" data-v="X">X (틀리다)</button>
    </div>`;
  } else { // 단답형
    html += `<input type="text" id="in${i}" placeholder="정답을 입력하세요" autocomplete="off">
      <button class="checkbtn" data-i="${i}">채점하기</button>`;
  }

  html += `<div class="result" id="res${i}"></div>
    <div class="explain" id="ex${i}"></div>`;
  card.innerHTML = html;
  quizEl.appendChild(card);
});

function showExplain(i, correctText){
  const ex = document.getElementById('ex'+i);
  ex.innerHTML = `<div class="ansline">✅ 정답: ${correctText}</div>${quiz[i].ex}`;
  ex.style.display = 'block';
}

quizEl.addEventListener('click', (e)=>{
  const t = e.target;

  // 객관식
  if(t.classList.contains('opt')){
    const i = +t.dataset.i, j = +t.dataset.j;
    if(state[i]) return;
    state[i] = true;
    const item = quiz[i];
    const btns = t.parentElement.querySelectorAll('.opt');
    btns.forEach((b,k)=>{
      b.classList.add('disabled');
      if(k === item.answer) b.classList.add('correct');
    });
    const correct = (j === item.answer);
    if(!correct) t.classList.add('wrong');
    const res = document.getElementById('res'+i);
    res.textContent = correct ? "⭕ 정답이에요!" : "❌ 틀렸어요.";
    res.className = 'result ' + (correct ? 'ox-ok' : 'ox-no');
    res.style.display = 'block';
    showExplain(i, String.fromCharCode(9312+item.answer) + " " + item.opts[item.answer]);
    markDone(correct);
  }

  // OX
  if(t.classList.contains('oxbtn')){
    const i = +t.dataset.i, v = (t.dataset.v === 'O');
    if(state[i]) return;
    state[i] = true;
    const item = quiz[i];
    const btns = t.parentElement.querySelectorAll('.oxbtn');
    btns.forEach(b=>{
      b.classList.add('disabled');
      const bv = (b.dataset.v === 'O');
      if(bv === item.answer) b.classList.add('correct');
    });
    const correct = (v === item.answer);
    if(!correct) t.classList.add('wrong');
    const res = document.getElementById('res'+i);
    res.textContent = correct ? "⭕ 정답이에요!" : "❌ 틀렸어요.";
    res.className = 'result ' + (correct ? 'ox-ok' : 'ox-no');
    res.style.display = 'block';
    showExplain(i, item.answer ? "O (맞다)" : "X (틀리다)");
    markDone(correct);
  }

  // 단답형 채점
  if(t.classList.contains('checkbtn')){
    const i = +t.dataset.i;
    if(state[i]) return;
    const item = quiz[i];
    const inp = document.getElementById('in'+i);
    const val = inp.value.trim().toLowerCase().replace(/\s/g,'');
    if(val === '') { inp.focus(); return; }
    state[i] = true;
    inp.disabled = true; t.disabled = true;
    const correct = item.accept.some(a => a.toLowerCase().replace(/\s/g,'') === val);
    inp.style.borderColor = correct ? 'var(--ok)' : 'var(--no)';
    inp.style.background = correct ? 'var(--okbg)' : 'var(--nobg)';
    const res = document.getElementById('res'+i);
    res.textContent = correct ? "⭕ 정답이에요!" : "❌ 틀렸어요.";
    res.className = 'result ' + (correct ? 'ox-ok' : 'ox-no');
    res.style.display = 'block';
    showExplain(i, item.display);
    markDone(correct);
  }
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  location.reload();
});
</script>
